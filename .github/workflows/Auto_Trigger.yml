name: Auto Trigger on SukiSU Update

on:
  schedule:
    - cron: '0 0 */3 * *'  # 每两天执行一次
  workflow_dispatch:     # 允许手动触发

jobs:
  check-and-trigger:
    runs-on: ubuntu-latest
    # 如果要运行自动编译工作流，请手动添加/修改仓库所有者用户名
    if: contains(fromJSON('["zzh20188", "elysias123"]'), github.repository_owner)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          
      - name: Get latest commit SHA from SukiSU-Ultra
        id: get_sha
        run: |
          LATEST_SHA=$(curl -s https://api.github.com/repos/SukiSU-Ultra/SukiSU-Ultra/commits/main | jq -r '.sha')
          echo "sha=$LATEST_SHA" >> $GITHUB_OUTPUT
          echo "Latest SHA: $LATEST_SHA"
          
      - name: Get previous SHA from sha branch
        id: get_prev_sha
        run: |

          if git ls-remote --heads origin sha | grep -q sha; then
            echo "SHA branch exists, fetching previous SHA..."
            git fetch origin sha:sha || true
            git checkout sha || true
            if [ -f "latest_sha.txt" ]; then
              PREV_SHA=$(cat latest_sha.txt)
              echo "prev_sha=$PREV_SHA" >> $GITHUB_OUTPUT
              echo "Previous SHA found: $PREV_SHA"
            else
              echo "prev_sha=" >> $GITHUB_OUTPUT
              echo "No previous SHA file found"
            fi
          else
            echo "prev_sha=" >> $GITHUB_OUTPUT
            echo "SHA branch does not exist yet"
          fi

          git checkout ${{ github.ref_name }}
          
      - name: Compare with previous SHA
        id: compare
        run: |
          CURR_SHA="${{ steps.get_sha.outputs.sha }}"
          PREV_SHA="${{ steps.get_prev_sha.outputs.prev_sha }}"
          
          echo "Current SHA: $CURR_SHA"
          echo "Previous SHA: $PREV_SHA"
          
          if [ "$CURR_SHA" != "$PREV_SHA" ]; then
            echo "new_commit=true" >> $GITHUB_OUTPUT
            echo "New commit detected!"
          else
            echo "new_commit=false" >> $GITHUB_OUTPUT
            echo "No new commits"
          fi
          
      - name: Update SHA file in sha branch
        if: steps.compare.outputs.new_commit == 'true'
        run: |

          git checkout sha 2>/dev/null || git checkout --orphan sha
          

          if [ ! -f "latest_sha.txt" ]; then
            git rm -rf . 2>/dev/null || true
          fi

          echo "${{ steps.get_sha.outputs.sha }}" > latest_sha.txt
          
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add latest_sha.txt
          git commit -m "Update SukiSU latest SHA to ${{ steps.get_sha.outputs.sha }}" || exit 0
          git push origin sha
          
      - name: Compute auto build version (UTC+8)
        id: auto_version
        if: steps.compare.outputs.new_commit == 'true'
        env:
          # 一次定时构建的目标组合，集中在这里，别再散落到下面 payload 里。
          AUTO_ANDROID_VERSION: android15
          AUTO_KERNEL_VERSION: "6.6"
          AUTO_SUB_LEVEL: "127"
          AUTO_OS_PATCH_LEVEL: "2026-04"
        run: |
          set -euo pipefail
          # run-name 表达式只支持 github / inputs 两个 context，且没有 date 函数，
          # 所以当前 UTC+8 日期必须在本 runner 里算，再通过 version input 传给
          # kernel-custom.yml，run 名字才会显示正确的构建日期。
          #
          # 拼出来的形状和 PR 门禁保持一致：
          #   <内核>.<子版本>-<标签>-<UTC+8日期>-<marker>
          # 例：6.6.127-Sailboat-20261022
          VERSION_LABEL="${{ vars.ABK_VERSION_LABEL || 'Sailboat' }}"
          BUILD_DATE=$(TZ='Asia/Shanghai' date +%Y%m%d)
          # 这个工作流是 schedule / workflow_dispatch 触发的，GITHUB_REF 永远是
          # refs/heads/<branch>，解析不出 PR 号；旧的 refs/pull/N 分支是死代码。
          # 定时构建用 SukiSU 的提交短 SHA 当 marker，天然唯一且可追溯。
          SUKI_SU_SHA="${{ steps.get_sha.outputs.sha }}"
          VERSION="${AUTO_KERNEL_VERSION}.${AUTO_SUB_LEVEL}-${VERSION_LABEL}-${BUILD_DATE}"
          if [ -n "${SUKI_SU_SHA}" ]; then
            VERSION="${VERSION}-sukisu${SUKI_SU_SHA:0:7}"
          fi
          # 跨 step 只能靠 GITHUB_OUTPUT 传值：下一个 step 是独立的 shell 进程，
          # 直接引用 ${VERSION} 会拿到空字符串（旧实现就是这么把 version 丢掉的）。
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Auto build version: ${VERSION}"

      - name: Trigger kernel-custom.yml workflow
        if: steps.compare.outputs.new_commit == 'true'
        env:
          AUTO_ANDROID_VERSION: android15
          AUTO_KERNEL_VERSION: "6.6"
          AUTO_SUB_LEVEL: "127"
          AUTO_OS_PATCH_LEVEL: "2026-04"
          # 关键：从上一个 step 的 output 取，而不是引用一个不存在的 shell 变量。
          AUTO_VERSION: ${{ steps.auto_version.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${AUTO_VERSION}" ]; then
            echo "::error::auto_version 没有产出 version，拒绝派发（否则 run 名字会缺日期）"
            exit 1
          fi
          jq -n \
            --arg ref "${TRIGGER_REF:-dev}" \
            --arg version "${AUTO_VERSION}" \
            --arg android_version "${AUTO_ANDROID_VERSION}" \
            --arg kernel_version "${AUTO_KERNEL_VERSION}" \
            --arg sub_level "${AUTO_SUB_LEVEL}" \
            --arg os_patch_level "${AUTO_OS_PATCH_LEVEL}" \
            '{
              ref: $ref,
              inputs: {
                android_version: $android_version,
                kernel_version: $kernel_version,
                sub_level: $sub_level,
                os_patch_level: $os_patch_level,
                revision: "",
                kernelsu_variant: "SukiSU",
                kernelsu_branch: "Stable(标准)",
                custom_ref: "",
                version: $version,
                build_time: "",
                virtualization_support: "off",
                use_zram: "false",
                use_bbg: "true",
                use_ddk: "false",
                use_ntsync: "false",
                use_networking: "false",
                use_kpm: "true",
                use_rekernel: "false",
                cancel_susfs: "false",
                supp_op: "false",
                zram_full_algo: "false",
                zram_extra_algos: "",
                kpm_password: "",
                custom_external_modules: "",
                custom_kernel_options: ""
              }
            }' > payload.json
          curl -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/kernel-custom.yml/dispatches \
            -d @payload.json
          echo "kernel-custom dispatched with version=${AUTO_VERSION}"
